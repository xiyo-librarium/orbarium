<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbarium — 本物の土地で、めぐりをつくる</title>
<meta name="description" content="世界の本物の土地で、雨・太陽・土・生き物とのめぐりを一から作っていく暮らしのシミュレーション。">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }</script>
<link rel="stylesheet" href="/next/next.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="row">
    <button class="pill" id="toMap" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>地図</button>
    <div class="chip" id="where">読みこみ中…</div>
    <span class="grow"></span>
    <div class="chip num" id="cash"></div>
    <button class="icon" id="bookBtn" aria-label="ノートを開く" title="ノート（めぐり・家計簿・予定・天気）"><svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/><path d="M9 8h6"/></svg></button>
    <button class="icon" id="cut" aria-label="壁を下げて中を見る" aria-pressed="false" title="壁を下げて中を見る"><svg viewBox="0 0 24 24"><path d="M4 20v-7h16v7z"/><path d="M4 9.5 12 4l8 5.5" stroke-dasharray="2.2 2.4"/><path d="M9 20v-3h3"/></svg></button>
    <button class="icon" id="undo" aria-label="取り消し" disabled><svg viewBox="0 0 24 24"><path d="M9 7H4v5"/><path d="M4.5 11.5A8 8 0 1 1 7 18"/></svg></button>
    <button class="icon" id="redo" aria-label="やり直し" disabled><svg viewBox="0 0 24 24"><path d="M15 7h5v5"/><path d="M19.5 11.5A8 8 0 1 0 17 18"/></svg></button>
  </div>
  <label class="sun"><span aria-hidden="true">☀</span><input type="range" id="hour" min="6" max="18" step="0.25" value="10" aria-label="時刻"><span id="hourTxt"></span></label>
</div>
<div id="card" class="card" hidden></div>
<div id="sheet" class="sheet" hidden><div class="sheet-in"><header><nav id="tabs"></nav><button class="x" id="sheetX" aria-label="閉じる">×</button></header><div class="sheet-body" id="sheetBody"></div></div></div>
<div id="report" class="report" hidden><div class="report-in"><div id="reportBody"></div><div class="report-act" id="reportAct"></div></div></div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>
<div class="bottom">
  <div class="subs" id="subs" hidden></div>
  <div class="draftbar editbar" id="draft" hidden><button id="draftNo" class="no" aria-label="やめて、編集の前に戻す" title="やめて、編集の前に戻す">✕</button><div id="draftTxt"></div><button id="draftYes" class="yes">✓ 決める</button></div>
  <p class="hint" id="hint"></p>
  <button class="season" id="season" hidden>季節を過ごす</button>
  <nav class="tools" id="tools" hidden></nav>
</div>
<script type="module" src="/next/js/main.js"></script>
</body>
</html>
